<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>免許攻略アプリ Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="免許攻略">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #1e293b;
        }

        .progress {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* タイマー表示 */
        .timer-box {
            background-color: #fee2e2;
            color: #dc2626;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            display: none;
        }

        .course-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .course-btn {
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background-color: #f8fafc;
            color: #475569;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
        }

        .course-btn.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #2563eb;
        }

        .home-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mode-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:active {
            background-color: #f1f5f9;
            transform: scale(0.99);
        }

        .mode-btn.highlight {
            border-color: #2563eb;
            background-color: #f0f6ff;
        }

        .mode-title {
            font-size: 1rem;
            font-weight: bold;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-desc {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        .badge {
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .badge-blue {
            background-color: #2563eb;
        }

        /* 標識画像 */
        .q-img-container {
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .q-img {
            max-height: 120px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .question-box {
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 600;
            color: #0f172a;
            min-height: 60px;
        }

        /* 危険予測問題スタイル */
        .risk-situation {
            background-color: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .sub-q-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .sub-q-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .sub-btn-group {
            display: flex;
            gap: 10px;
        }

        .sub-btn {
            flex: 1;
            padding: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
        }

        .sub-btn.selected-true {
            background-color: #ef4444;
            color: white;
            border-color: #dc2626;
        }

        .sub-btn.selected-false {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }

        .sub-exp {
            font-size: 0.85rem;
            margin-top: 6px;
            padding: 6px;
            border-radius: 4px;
            display: none;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            padding: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-maru { background-color: #ef4444; color: white; }
        .btn-batsu { background-color: #3b82f6; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .explanation {
            background-color: #f8fafc;
            border-left: 4px solid #94a3b8;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
            margin-top: 12px;
        }

        .explanation.correct { border-color: #22c55e; background-color: #f0fdf4; }
        .explanation.wrong { border-color: #ef4444; background-color: #fef2f2; }
        .explanation-title { font-weight: bold; margin-bottom: 4px; }

        .nav-btn {
            background-color: #0f172a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .secondary-btn {
            background-color: #e2e8f0;
            color: #334155;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        /* 苦手分析エリア */
        .analytics-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            margin-top: 8px;
        }

        .analytics-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .meter-item {
            margin-bottom: 8px;
        }

        .meter-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 3px;
        }

        .meter-bar-bg {
            height: 8px;
            background: #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
        }

        .meter-bar-fill {
            height: 100%;
            background: #2563eb;
            width: 0%;
            transition: width 0.4s ease;
        }

        .result-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .result-badge {
            font-size: 2rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .pass-badge { background-color: #dcfce7; color: #15803d; }
        .fail-badge { background-color: #fee2e2; color: #b91c1c; }

        .score-detail {
            font-size: 0.95rem;
            color: #475569;
            text-align: left;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="header">
        <h1 id="app-title">学科試験 攻略アプリ</h1>
        <div class="progress" id="progress">コースとモードを選択してください</div>
    </div>

    <!-- タイマー -->
    <div class="timer-box" id="timer-box">⏱ 残り時間: <span id="timer-text">50:00</span></div>

    <!-- ホーム画面 -->
    <div id="home-screen" class="home-screen">
        <div class="course-select">
            <button class="course-btn active" id="btn-course-car" onclick="selectCourse('car')">🚗 普通免許</button>
            <button class="course-btn" id="btn-course-truck" onclick="selectCourse('truck')">🚚 準中・大型</button>
        </div>

        <button class="mode-btn highlight" onclick="startQuiz('mock')">
            <div class="mode-title">🎓 本免模擬試験 <span class="badge">100点満点</span></div>
            <div class="mode-desc">文章90問＋危険予測5問（50分 / 90点以上合格）</div>
        </button>

        <button class="mode-btn" onclick="startQuiz('number')">
            <div class="mode-title">🔢 数字特訓モード <span class="badge badge-blue" id="number-count-badge">0問</span></div>
            <div class="mode-desc">速度・メートル・トン等の数値問題をAI自動抽出し特訓</div>
        </button>

        <button class="mode-btn" onclick="startQuiz('sign')">
            <div class="mode-title">🪧 標識・標示特訓 <span class="badge badge-blue" id="sign-count-badge">0問</span></div>
            <div class="mode-desc">標識画像を見て解答する視覚問題を集中特訓</div>
        </button>

        <button class="mode-btn" onclick="startQuiz('random10')">
            <div class="mode-title">⚡ スキマ時間 10問テスト</div>
            <div class="mode-desc">全問題からランダムで10問出題</div>
        </button>

        <button class="mode-btn" onclick="startQuiz('wrong')">
            <div class="mode-title">
                🎯 弱点克服モード
                <span class="badge" id="wrong-count-badge">0問</span>
            </div>
            <div class="mode-desc">過去に間違えた問題だけを集中復習</div>
        </button>

        <button class="mode-btn" onclick="startQuiz('all')">
            <div class="mode-title">🔥 全問マスター <span class="badge badge-blue" id="total-count-badge">90問</span></div>
            <div class="mode-desc">選択中コースの全文章問題を順番に攻略</div>
        </button>

        <!-- カテゴリ別・苦手分析 -->
        <div class="analytics-box">
            <div class="analytics-title">
                <span>📊 カテゴリ別正答率（苦手分析）</span>
                <span style="font-size: 0.75rem; color: #64748b; font-weight: normal; cursor: pointer;" onclick="resetAnalytics()">履歴リセット</span>
            </div>
            <div id="analytics-meters">
                <!-- 動的に生成 -->
            </div>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display: none;">
        <!-- 画像エリア -->
        <div class="q-img-container" id="q-img-container">
            <img src="" alt="標識画像" class="q-img" id="q-img">
        </div>

        <!-- 文章問題表示部 -->
        <div id="normal-q-box">
            <div class="question-box" id="question">問題文</div>

            <div class="btn-group" id="btn-group">
                <button class="btn btn-maru" onclick="checkAnswer(true)">⭕</button>
                <button class="btn btn-batsu" onclick="checkAnswer(false)">❌</button>
            </div>
        </div>

        <!-- 危険予測表示部 -->
        <div id="risk-q-box" style="display: none;">
            <div class="risk-situation" id="risk-situation">シチュエーション</div>
            <div id="risk-sub-container"></div>
            <button class="nav-btn" id="risk-submit-btn" onclick="checkRiskAnswer()">判定する (配点2点)</button>
        </div>

        <!-- 解説エリア -->
        <div class="explanation" id="explanation">
            <div class="explanation-title" id="exp-title">結果</div>
            <div id="exp-text">解説文</div>
        </div>

        <button class="nav-btn" id="next-btn" onclick="nextQuestion()" style="display: none;">次の問題へ</button>
        <button class="secondary-btn" onclick="confirmGoHome()">ホームに戻る</button>
    </div>

    <!-- 結果画面 -->
    <div class="result-screen" id="result-screen">
        <h2>テスト終了</h2>
        <div class="result-badge" id="result-badge">合格</div>
        <div class="score-detail" id="score-detail">
            <!-- スコア詳細 -->
        </div>
        <button class="nav-btn" onclick="goHome()">ホームに戻る</button>
    </div>
</div>

<script>
    // 1. 普通免許用問題データ (一部標識画像つき)
    const carQuestions = [
        { id: "c1", q: "現行の普通自動車免許（2017年3月12日以降取得）で運転できる自動車は、車両総重量3.5トン未満、最大積載量2.0トン未満、乗車定員10人以下である。", a: true, exp: "正しいです。車両総重量3.5t以上や最大積載量2.0t以上の場合は準中型免許以上が必要です。" },
        { id: "c2", q: "普通自動車で高速自動車国道の本線車道を走行するときの法定最高速度は、標識等で指定がなければ時速100キロメートルである。", a: true, exp: "正しいです。法定最高速度は100km/hです。" },
        { id: "c3", q: "標識や標示で指定されていない一般道路での普通自動車の法定最高速度は、時速60キロメートルである。", a: true, exp: "正しいです。一般道路の法定最高速度は60km/hです。" },
        { id: "c4", q: "乗車定員が5人の普通乗用自動車に、大人（12歳以上）2人と子ども（12歳未満）3人が乗車することは定員オーバーとなる。", a: false, exp: "誤りです。12歳未満の子ども3人は大人2人分（3人÷1.5＝大人2人）として計算するため、合計大人4人分となり定員内です。" },
        { id: "c5", q: "普通乗用自動車の積載物の長さ制限は、自動車の長さの1.2倍までである。", a: true, exp: "正しいです。法改正により長さ・幅ともに自動車の1.2倍まで積載可能となりました。" },
        { id: "c6", q: "軽自動車に荷物を積む場合、積載物の高さ制限は地上から2.5メートルまでである。", a: true, exp: "正しいです。普通自動車は3.8mですが、軽自動車は2.5mです。" },
        { id: "c7", q: "普通自動車の乗車定員には、運転者も含まれる。", a: true, exp: "正しいです。乗車定員は「運転者を含めた全体の人数」です。" },
        { id: "c8", q: "原動機付自転車や小型特殊自動車は、普通自動車免許を取得していれば運転することができる。", a: true, exp: "正しいです。普通免許で普通自動車・小型特殊自動車・原動機付自転車が運転できます。" },
        { id: "c9", q: "シートベルトは、後部座席の乗車者であっても着用が義務付けられている。", a: true, exp: "正しいです。全座席で着用が義務化されています。" },
        { id: "c10", q: "運転者がチャイルドシートを使用させなければならないのは、6歳未満の幼児を乗車させるときである。", a: true, exp: "正しいです。6歳未満の幼児にはチャイルドシートの使用義務があります。" },
        { id: "c11", q: "信号機のない交差点で優先道路を通行しているときは、交差点とその手前30メートル以内の場所であっても追い越しができる。", a: true, exp: "正しいです。優先道路を通行中に限り、交差点とその手前30m以内での追い越し禁止が解除されます。" },
        { id: "c12", q: "横断歩道や自転車横断帯とその手前30メートル以内の場所では、優先道路を通行していても追い越しや追い抜きが禁止されている。", a: true, exp: "正しいです。横断歩道等は優先道路であっても例外なく追い越し・追い抜き禁止です。" },
        { id: "c13", q: "この標識のある場所では、車は停車することはできるが、駐車することはできない。", a: false, img: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2296%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2288%22%20fill%3D%22%231d4ed8%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%2214%22/%3E%3Cpath%20d%3D%22M50%2050L150%20150M150%2050L50%20150%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22butt%22/%3E%3C/svg%3E", exp: "誤りです。これは「駐停車禁止」の標識であり、駐車だけでなく停車も禁止されています。" },
        { id: "c14", q: "「徐行」の標識のある場所では、車は徐行して進行しなければならない。", a: true, exp: "正しいです。徐行とは、直ちに停止できる速度で進行することです。" },
        { id: "c15", q: "この標識がある場所では、指定された最高速度を超えて運転してはならない。", a: true, img: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2292%22%20fill%3D%22%23fff%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%2218%22/%3E%3Ctext%20x%3D%22100%22%20y%3D%22128%22%20font-size%3D%2284%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%3E50%3C/text%3E%3C/svg%3E", exp: "正しいです。「最高速度（時速50キロ）」の指定標識です。" },
        { id: "c16", q: "黄色の灯火の点滅信号は「徐行して進行しなければならない」という意味である。", a: false, exp: "誤りです。「他の交通に注意して進行することができる」の意味であり、徐行義務はありません。" },
        { id: "c17", q: "赤色の灯火の点滅信号は「一時停止し、安全を確認した後に進行することができる」という意味である。", a: true, exp: "正しいです。一時停止標識と同じ扱いです。" },
        { id: "c18", q: "この標識のある交差点に接近したときは、停止線の直前で一時停止しなければならない。", a: true, img: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Cpolygon%20points%3D%2210%2C30%20190%2C30%20100%2C185%22%20fill%3D%22%23dc2626%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%228%22%20stroke-linejoin%3D%22round%22/%3E%3Cpolygon%20points%3D%2238%2C44%20162%2C44%20100%2C150%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linejoin%3D%22round%22/%3E%3Ctext%20x%3D%22100%22%20y%3D%2282%22%20font-size%3D%2230%22%20font-weight%3D%22bold%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%3E%E6%AD%A2%E3%81%BE%E3%82%8C%3C/text%3E%3C/svg%3E", exp: "正しいです。「一時停止」の標識です。" },
        { id: "c19", q: "交差点を右折するときは、あらかじめ道路の中央（一方通行道路では右端）に寄り、交差点の中心のすぐ内側を徐行して通過する。", a: true, exp: "正しいです。右折の正しい通行方法です。" },
        { id: "c20", q: "環状交差点（ラウンドアバウト）に入ろうとするときは、徐行して進入しなければならない。", a: true, exp: "正しいです。環状交差点内を通行する車両が優先となります。" },

        { id: "c24", q: "軌道敷内（路面電車のレール上）は原則として通行禁止だが、右左折や横断のために横切る場合は通行できる。", a: true, exp: "正しいです。危険防止や右左折などの場合は通行が認められます。" },

        { id: "c28", q: "高速道路で故障により停止した場合、停止表示器材（三角表示板）を後方に設置する義務がある。", a: true, exp: "正しいです。設置を怠ると高速道路停止表示器材設置違反となります。" },

    // AI（正規表現）解析：数字問題抽出
    function isNumberQuestion(q) {
        const regex = /[0-9０-９一二三四五六七八九十百千]+|メートル|キロ|トン|歳|時間|日|分|m|km|t/i;
        return regex.test(q.q);
    }

    // カテゴリ自動判定
    function getQuestionCategory(q) {
        if (q.cat) return q.cat;
        if (q.img || /標識|標示|信号/.test(q.q)) return "標識・信号";
        if (/駐停車|駐車|停車/.test(q.q)) return "駐停車";
        if (/速度|キロ|徐行|追い越し|追抜き/.test(q.q)) return "速度・通行";
        if (isNumberQuestion(q)) return "数字・数量";
        return "一般ルール";
    }

    function updateBadges() {
        const wrongIds = getWrongIds();
        document.getElementById("wrong-count-badge").innerText = `${wrongIds.length}問`;
        document.getElementById("total-count-badge").innerText = `${activeQuestions.length}問`;

        const numCount = activeQuestions.filter(isNumberQuestion).length;
        document.getElementById("number-count-badge").innerText = `${numCount}問`;

        const signCount = activeQuestions.filter(q => q.img || /標識|標示/.test(q.q)).length;
        document.getElementById("sign-count-badge").innerText = `${signCount}問`;
    }

    // カテゴリ別苦手分析の表示
    function renderAnalytics() {
        const container = document.getElementById("analytics-meters");
        container.innerHTML = "";

        const data = getAnalyticsData();
        const categories = ["標識・信号", "数字・数量", "駐停車", "速度・通行", "一般ルール"];
        if (currentCourse === "truck") categories.push("免許・車両区分", "大型車の特性", "積載・過積載");

        categories.forEach(cat => {
            const catData = data[cat] || { total: 0, correct: 0 };
            const rate = catData.total > 0 ? Math.round((catData.correct / catData.total) * 100) : 0;

            const item = document.createElement("div");
            item.className = "meter-item";
            item.innerHTML = `
                <div class="meter-label">
                    <span>${cat} (${catData.correct}/${catData.total}問)</span>
                    <span>${rate}%</span>
                </div>
                <div class="meter-bar-bg">
                    <div class="meter-bar-fill" style="width: ${rate}%;"></div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function recordAnalytics(cat, isCorrect) {
        const data = getAnalyticsData();
        if (!data[cat]) data[cat] = { total: 0, correct: 0 };
        data[cat].total += 1;
        if (isCorrect) data[cat].correct += 1;
        saveAnalyticsData(data);
    }

    function resetAnalytics() {
        if (confirm("苦手分析のデータをリセットしますか？")) {
            localStorage.removeItem(getStorageKey('analytics_data'));
            renderAnalytics();
        }
    }

    function startQuiz(mode) {
        currentMode = mode;
        const wrongIds = getWrongIds();
        currentQuizQueue = [];

        if (mode === 'mock') {
            // 90問文章問題 + 5問危険予測
            const shuffledNormal = [...activeQuestions].sort(() => Math.random() - 0.5).slice(0, 90);
            const shuffledRisk = [...activeRiskQuestions].sort(() => Math.random() - 0.5).slice(0, 5);
            
            shuffledNormal.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
            shuffledRisk.forEach(q => currentQuizQueue.push({ type: 'risk', data: q }));
            
            startTimer(3000); // 50分タイマー
        } else if (mode === 'number') {
            const numQs = activeQuestions.filter(isNumberQuestion);
            numQs.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
        } else if (mode === 'sign') {
            const signQs = activeQuestions.filter(q => q.img || /標識|標示/.test(q.q));
            signQs.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
        } else if (mode === 'random10') {
            const shuffled = [...activeQuestions].sort(() => Math.random() - 0.5).slice(0, 10);
            shuffled.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
        } else if (mode === 'wrong') {
            if (wrongIds.length === 0) {
                alert("間違えた問題はありません！");
                return;
            }
            const wrongQs = activeQuestions.filter(q => wrongIds.includes(q.id));
            wrongQs.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
        } else if (mode === 'all') {
            activeQuestions.forEach(q => currentQuizQueue.push({ type: 'normal', data: q }));
        }

        currentIdx = 0;
        normalScore = 0;
        riskScore = 0;
        userAnswers = [];

        document.getElementById("home-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";

        loadQuestion();
    }

    function startTimer(seconds) {

        updateTimerDisplay();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("⏰ 時間切れです！採点します。");
                showResult();
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById("timer-box").style.display = "none";
    }

    function updateTimerDisplay() {
        const min = Math.floor(timeRemaining / 60);
        const sec = timeRemaining % 60;
        document.getElementById("timer-text").innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function loadQuestion() {
        const item = currentQuizQueue[currentIdx];
        document.getElementById("progress").innerText = `問題 ${currentIdx + 1} / ${currentQuizQueue.length}`;
        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        const imgContainer = document.getElementById("q-img-container");
        const qImg = document.getElementById("q-img");

        if (item.type === 'normal') {
            document.getElementById("normal-q-box").style.display = "block";
            document.getElementById("risk-q-box").style.display = "none";
            document.getElementById("question").innerText = item.data.q;

            // 画像判定
            if (item.data.img) {
                qImg.src = item.data.img;
                imgContainer.style.display = "block";
            } else {
                imgContainer.style.display = "none";
            }

            const buttons = document.querySelectorAll("#btn-group .btn");
            buttons.forEach(btn => btn.disabled = false);
        } else if (item.type === 'risk') {
            document.getElementById("normal-q-box").style.display = "none";
            document.getElementById("risk-q-box").style.display = "block";
            imgContainer.style.display = "none";

            document.getElementById("risk-situation").innerText = item.data.situation;

            const subContainer = document.getElementById("risk-sub-container");
            subContainer.innerHTML = "";
            currentRiskAnswers = [null, null, null];

            item.data.subQuestions.forEach((sq, idx) => {
                const card = document.createElement("div");
                card.className = "sub-q-card";
                card.innerHTML = `
                    <div class="sub-q-text">${sq.q}</div>
                    <div class="sub-btn-group">
                        <button class="sub-btn" id="risk-btn-${idx}-true" onclick="selectRiskSub(${idx}, true)">⭕ 正しい</button>
                        <button class="sub-btn" id="risk-btn-${idx}-false" onclick="selectRiskSub(${idx}, false)">❌ 誤り</button>
                    </div>
                    <div class="sub-exp" id="risk-exp-${idx}"></div>
                `;
                subContainer.appendChild(card);
            });

            document.getElementById("risk-submit-btn").style.display = "block";
            document.getElementById("risk-submit-btn").disabled = false;
        }
    }

    function checkAnswer(userAnswer) {
        const item = currentQuizQueue[currentIdx];
        const q = item.data;
        const isCorrect = (userAnswer === q.a);

        const buttons = document.querySelectorAll("#btn-group .btn");
        buttons.forEach(btn => btn.disabled = true);

        const expBox = document.getElementById("explanation");
        const expTitle = document.getElementById("exp-title");
        const expText = document.getElementById("exp-text");

        expBox.style.display = "block";
        let wrongIds = getWrongIds();

        const cat = getQuestionCategory(q);
        recordAnalytics(cat, isCorrect);

        if (isCorrect) {
            normalScore++;
            expBox.className = "explanation correct";
            expTitle.innerText = "⭕ 正解！";
            if (wrongIds.includes(q.id)) {
                wrongIds = wrongIds.filter(id => id !== q.id);
                saveWrongIds(wrongIds);
            }
        } else {
            expBox.className = "explanation wrong";
            expTitle.innerText = "❌ 不正解…";
            if (!wrongIds.includes(q.id)) {
                wrongIds.push(q.id);
                saveWrongIds(wrongIds);
            }
        }

        expText.innerText = q.exp;
        document.getElementById("next-btn").style.display = "block";
        updateBadges();
    }

    function selectRiskSub(subIdx, answer) {
        currentRiskAnswers[subIdx] = answer;
        const trueBtn = document.getElementById(`risk-btn-${subIdx}-true`);
        const falseBtn = document.getElementById(`risk-btn-${subIdx}-false`);

        trueBtn.className = `sub-btn ${answer === true ? 'selected-true' : ''}`;
        falseBtn.className = `sub-btn ${answer === false ? 'selected-false' : ''}`;
    }

    // 危険予測の判定（3問全問正解で初めて2点！）
    function checkRiskAnswer() {
        if (currentRiskAnswers.includes(null)) {
            alert("イ・ロ・ハのすべての問題に回答してください。");
            return;
        }

        const item = currentQuizQueue[currentIdx];
        const subQs = item.data.subQuestions;

        let allCorrect = true;

        subQs.forEach((sq, idx) => {
            const userAns = currentRiskAnswers[idx];
            const isSubCorrect = (userAns === sq.a);
            if (!isSubCorrect) allCorrect = false;

            const expDiv = document.getElementById(`risk-exp-${idx}`);
            expDiv.style.display = "block";
            expDiv.style.backgroundColor = isSubCorrect ? "#f0fdf4" : "#fef2f2";
            expDiv.style.color = isSubCorrect ? "#166534" : "#991b1b";
            expDiv.innerText = `${isSubCorrect ? '⭕' : '❌'} ${sq.exp}`;

            // ボタン無効化
            document.getElementById(`risk-btn-${idx}-true`).disabled = true;
            document.getElementById(`risk-btn-${idx}-false`).disabled = true;
        });

        document.getElementById("risk-submit-btn").style.display = "none";

        const expBox = document.getElementById("explanation");
        const expTitle = document.getElementById("exp-title");
        const expText = document.getElementById("exp-text");
        expBox.style.display = "block";

        if (allCorrect) {
            riskScore += 2; // 3全問正解で2点獲得
            expBox.className = "explanation correct";
            expTitle.innerText = "⭕ 完ペキ！ 2点獲得！";
            expText.innerText = "3小問すべて正解したため、2点が入りました。";
        } else {
            expBox.className = "explanation wrong";
            expTitle.innerText = "❌ 0点（1問以上間違えています）";
            expText.innerText = "本番仕様につき、1つでも不備があると2点獲得できません。";
        }

        recordAnalytics("危険予測", allCorrect);
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < currentQuizQueue.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        stopTimer();
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "flex";
        document.getElementById("progress").innerText = "結果発表";

        const totalScore = normalScore + riskScore;
        const resultBadge = document.getElementById("result-badge");
        const scoreDetail = document.getElementById("score-detail");

        if (currentMode === 'mock') {
            const isPass = totalScore >= 90;
            resultBadge.className = `result-badge ${isPass ? 'pass-badge' : 'fail-badge'}`;
            resultBadge.innerText = isPass ? "🎉 判定：合格！" : "😭 判定：不合格...";

            scoreDetail.innerHTML = `
                <b>合計得点: ${totalScore}点 / 100点</b> (合格ライン: 90点)<br>
                ・文章問題 (1点×90問): ${normalScore}点<br>
                ・危険予測 (2点×5問): ${riskScore}点
            `;
        } else {
            resultBadge.className = "result-badge pass-badge";
            resultBadge.innerText = "テスト完了！";
            scoreDetail.innerHTML = `
                <b>正解数: ${normalScore + (riskScore/2)} / ${currentQuizQueue.length} 問</b>
            `;
        }

        renderAnalytics();
    }

    function confirmGoHome() {
        if (confirm("途中で終了してホームに戻りますか？")) {
            goHome();
        }
    }

    function goHome() {
        stopTimer();
        document.getElementById("home-screen").style.display = "flex";
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("progress").innerText = "コースとモードを選択してください";
        updateBadges();
        renderAnalytics();
    }

    // 初期化
    selectCourse('car');
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
</script>

</body>
</html>
